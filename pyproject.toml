[project]
name = "gold-smc-ict-bot"
version = "0.1.0"
description = "Professional XAUUSD (Gold) Telegram trading bot — SMC/ICT methodology, AI reasoning, news-aware. Advisory only; never auto-trades."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gold-smc-ict-bot contributors" }]
keywords = ["xauusd", "gold", "trading", "smc", "ict", "telegram", "bot"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "coverage>=7.4",
    "bandit>=1.7",
    "pip-audit>=2.6",
]

[project.scripts]
goldbot = "goldbot.cli:main"
ayzr = "goldbot.ayzr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The starter kit lives beside the project it was extracted from and is run
# by the same gate, so the patterns cannot rot away from their tests.
testpaths = ["tests", "starter/tests"]
pythonpath = ["src", "starter"]
addopts = "-q"

[tool.coverage.run]
# ``source`` (not a path glob) is what makes coverage fail a module the suite
# never imports: a file that is never loaded is counted as 0% rather than being
# invisible to the report.
source = ["goldbot", "goldkit"]
branch = false

[tool.coverage.report]
# The floor sits a point under the measured 98% so ordinary refactoring does not
# redden CI, while a real drop — a whole module losing its tests — does. Raise it
# as coverage rises; never lower it to make a red run green.
fail_under = 96
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "starter"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.bandit]
# Only the package is scanned: tests reach the network on purpose and research
# scripts are one-off, so a finding there is noise rather than signal. Any
# suppression in the source carries a ``# nosec BXXX`` with the reason above it,
# so a reviewer can weigh it instead of taking it on faith.
exclude_dirs = ["tests", "research", "starter/tests"]
