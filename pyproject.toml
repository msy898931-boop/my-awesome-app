[project]
name = "gold-smc-ict-bot"
version = "0.1.0"
description = "Professional XAUUSD (Gold) Telegram trading bot — SMC/ICT methodology, AI reasoning, news-aware. Advisory only; never auto-trades."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gold-smc-ict-bot contributors" }]
keywords = ["xauusd", "gold", "trading", "smc", "ict", "telegram", "bot"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "coverage>=7.4"]

[project.scripts]
goldbot = "goldbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
# ``source`` (not a path glob) is what makes coverage fail a module the suite
# never imports: a file that is never loaded is counted as 0% rather than being
# invisible to the report.
source = ["goldbot"]
branch = false

[tool.coverage.report]
# The floor sits a point under the measured 79% so ordinary refactoring does not
# redden CI, while a real drop — a whole module losing its tests — does. Raise it
# as coverage rises; never lower it to make a red run green.
fail_under = 78
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
