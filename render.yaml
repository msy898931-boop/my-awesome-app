# One free web service runs both bots.
#
# Render's free tier gives a single web service and 750 instance-hours a month.
# Two always-on services would need 1440 hours and would suspend *every* free
# service in the workspace, and a persistent disk needs a paid instance besides.
# So AYZR does not get a service of its own: `python -m goldbot.dual` starts the
# bot's loop and AYZR's loop side by side in one process, each with its own
# token, chat, journal, and AI key, over one health port.
#
# What this costs: there is no disk, so nothing survives a restart. The bot's
# per-day AI counter, the events it has announced, and AYZR's journal are all
# reset when Render recycles the instance. That is the price of free, and the
# reason the one-month shadow test is a paid-tier exercise. Durable state needs
# a paid instance plus the disk block (kept in git history at commit 33a5d26).
services:
  - type: web
    name: goldbot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -e .
    startCommand: python -m goldbot.dual
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GOLDBOT_ENABLE_YAHOO
        value: "0"
      - key: GOLDBOT_ENABLE_BINANCE
        value: "1"
      # AYZR runs in this same process, on its own quota and its own journal.
      # Its runner is started once, by the bot's `_start_ayzr`, so the dual
      # supervisor passes `start_runner=False` to AYZR's loop.
      - key: AYZR_ENABLED
        value: "1"
      # Secrets are set in the Render dashboard, never in this file:
      #   TELEGRAM_BOT_TOKEN        — the main bot
      #   TELEGRAM_CHAT_ID
      #   GROQ_API_KEY              — the bot's key
      #   AYZR_TELEGRAM_BOT_TOKEN   — a *second* bot, its own chat
      #   AYZR_TELEGRAM_CHAT_ID
      #   AYZR_AI_KEY               — AYZR's own key (falls back to GROQ_API_KEY)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AYZR_TELEGRAM_BOT_TOKEN
        sync: false
      - key: AYZR_TELEGRAM_CHAT_ID
        sync: false
      - key: AYZR_AI_KEY
        sync: false

