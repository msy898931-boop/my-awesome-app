name: Bug report
description: Something is wrong — a wrong read, a crash, or a card that lies.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful thing you can send is a minimal
        reproduction: what you did, what happened, what you expected.

        For a **security** problem, do not open an issue — use the private route
        in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including any message or traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command you ran, and the environment if it matters.
      placeholder: |
        PYTHONPATH=src python -m goldbot.cli analyse
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: false
