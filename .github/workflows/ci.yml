name: ci

# Runs the three checks that keep the code honest: the linter, the type checker,
# and the test suite. The suite is offline by design, so it is deterministic and
# a red run always means the logic broke rather than a feed being down.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package targets 3.10+, so both ends are exercised: the oldest
        # supported interpreter and a current one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests research

      - name: Check formatting (ruff format)
        run: python -m ruff format --check src tests research

      - name: Type check (mypy)
        run: python -m mypy src/goldbot

      - name: Security lint (bandit)
        # Static analysis for the code paths that touch the network, spawn
        # threads, and parse untrusted feeds. A finding here is a real one:
        # every suppression in the source carries a written reason.
        run: python -m bandit -c pyproject.toml -r src/goldbot

      - name: Dependency audit (pip-audit)
        # Scoped to the project's own dependencies (`.`), not the whole
        # environment: auditing everything would flag the runner's setuptools
        # and pip-audit's own transitive deps, which this project does not
        # ship. The runtime has no third-party dependencies today — the point
        # of the gate is that one added later cannot arrive with a known CVE.
        run: python -m pip_audit .

      - name: Test (pytest)
        run: python -m coverage run -m pytest tests -q

      - name: Coverage floor
        # Fails the job when total coverage drops below ``fail_under``. The
        # number is not the goal — a gate is what stops the reported figure
        # from drifting away from the truth unnoticed.
        run: python -m coverage report
