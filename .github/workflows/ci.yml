name: ci

# Runs the three checks that keep the code honest: the linter, the type checker,
# and the test suite. The suite is offline by design, so it is deterministic and
# a red run always means the logic broke rather than a feed being down.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package targets 3.10+, so both ends are exercised: the oldest
        # supported interpreter and a current one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests research starter

      - name: Check formatting (ruff format)
        run: python -m ruff format --check src tests research starter

      - name: Type check (mypy)
        # Both packages are checked: the starter kit is shipped code too, and a
        # type error there would otherwise reach a reader who copied it out.
        run: python -m mypy src/goldbot starter/goldkit

      - name: Security lint (bandit)
        # Static analysis for the code paths that touch the network, spawn
        # threads, and parse untrusted feeds. A finding here is a real one:
        # every suppression in the source carries a written reason.
        run: python -m bandit -c pyproject.toml -r src/goldbot starter/goldkit

      - name: Dependency audit (pip-audit)
        # Scoped to the project's own dependencies (`.`), not the whole
        # environment: auditing everything would flag the runner's setuptools
        # and pip-audit's own transitive deps, which this project does not
        # ship. The runtime has no third-party dependencies today — the point
        # of the gate is that one added later cannot arrive with a known CVE.
        run: python -m pip_audit .

      - name: Test (pytest)
        # The starter kit's tests run here too, so the patterns stay covered by
        # the same gate as the project they were extracted from.
        run: python -m coverage run -m pytest tests starter/tests -q

      - name: Coverage floor
        # Fails the job when total coverage drops below ``fail_under``. The
        # number is not the goal — a gate is what stops the reported figure
        # from drifting away from the truth unnoticed.
        run: python -m coverage report

  # A committed key is a leaked key: history keeps it even after the line is
  # deleted. The scan runs on every change so a secret is caught at the door,
  # not discovered after it has already been pushed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a secret added and then removed in a later commit
          # is still found.
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image is a shipped artefact, so it is built on every change rather
  # than discovered to be broken at deploy time. Nothing is pushed: the check
  # is that the multi-stage build succeeds and the resulting container starts
  # and answers its own health endpoint.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t goldbot:ci .

      - name: The container starts and its health endpoint answers
        run: |
          set -eu
          docker run -d --name goldbot-ci \
            -e PORT=8080 \
            -e TELEGRAM_BOT_TOKEN=123456:CI \
            -e TELEGRAM_CHAT_ID=1 \
            goldbot:ci bot
          # The loop primes, opens the health port, then starts polling.
          for attempt in $(seq 1 20); do
            sleep 3
            if docker exec goldbot-ci \
              python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"; then
              echo "health endpoint answered"
              docker logs goldbot-ci
              exit 0
            fi
          done
          echo "health endpoint never answered"
          docker logs goldbot-ci
          exit 1

      - name: The container does not run as root
        run: |
          set -eu
          user=$(docker run --rm --entrypoint id goldbot:ci)
          echo "$user"
          echo "$user" | grep -qv "uid=0" || { echo "container runs as root"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f goldbot-ci || true
